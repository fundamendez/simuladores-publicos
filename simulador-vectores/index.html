<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Vectores</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>
<body>
    <a href="../index.html" class="btn-volver-sim">← Volver al Menú</a>
    <img src="../assets/img/fundamendez-logo.png" alt="FundaMendez" class="logo-top-right">

    <main class="container">
        <h1>Simulador de Vectores</h1>
        
        <div class="controls-panel">
            <div class="control-group">
                <label>Valor:</label>
                <input type="number" id="val-agregar" placeholder="Ej: 5">
                <button class="btn-accion" onclick="agregar()">Agregar al Tope</button>
            </div>

            <div class="algorithms">
                <div class="control-group">
                    <label>Índice:</label>
                    <input type="number" id="idx-operacion" placeholder="Idx" style="width: 60px;">
                    <label>Valor:</label>
                    <input type="number" id="val-operacion" placeholder="Val" style="width: 60px;">
                    
                    <button class="btn-alg" onclick="insertar()">Insertar</button>
                    <button class="btn-alg" onclick="eliminarOrdenado()">Elim. Ordenada</button>
                    <button class="btn-alg" onclick="eliminarDesordenado()">Elim. Desordenada</button>
                </div>
            </div>

            <div class="algorithms">
                <div class="control-group">
                    <input type="number" id="val-buscar" placeholder="Valor a buscar">
                    <button class="btn-info" onclick="buscar()">Búsqueda Lineal</button>
                </div>
            </div>
        </div>

        <div class="status-message" id="status-message">
            Vector inicializado. Tope actual: 0 | Capacidad Máxima: 10
        </div>
        
        <div class="tda-container" id="array-wrapper">
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
